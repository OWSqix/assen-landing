<body>
  <!-- Unified photo grade (LUT). A single subtle warm/duotone color grade shared by
       all photographic imagery so placeholder + future real photos read as one set.
       Applied via the .is-graded class (filter: url(#assen-grade)). The hero image is
       intentionally NOT graded: it owns a GSAP parallax transform + scale hovers and a
       saturate/contrast filter, and a url() filter would create a stacking context and
       not stack with the existing declaration. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false"
    style="position:absolute;width:0;height:0;overflow:hidden">
    <filter id="assen-grade" color-interpolation-filters="sRGB">
      <!-- gentle warm push: lift R, hold G, ease B; tiny cross-channel warmth -->
      <feColorMatrix type="matrix" values="1.04 0.02 0    0 0
                                            0.01 1.0  0.01 0 0
                                            0    0.02 0.92 0 0
                                            0    0    0    1 0" />
      <!-- lift shadows / soften highlights a hair so the grade reads filmic, not flat -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.98" intercept="0.012" />
        <feFuncG type="linear" slope="0.98" intercept="0.008" />
        <feFuncB type="linear" slope="0.97" intercept="0.006" />
      </feComponentTransfer>
    </filter>
  </svg>
